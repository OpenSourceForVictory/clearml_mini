# Legacy explicit overlay. Main compose.yml now includes optional shared storage.
# Existing commands may keep this file; new deployments do not need to add it.
services:
  api:
    environment:
      SHARED_ARTIFACT_HOST_ROOT: ${SHARED_ARTIFACT_HOST_ROOT:?set existing host shared mount}
      MINI_EVAL_SHARED_STORAGE: ${MINI_EVAL_SHARED_STORAGE:-}
    volumes:
      - type: bind
        source: ${SHARED_ARTIFACT_HOST_ROOT:?set existing host shared mount}
        target: /mnt/mini-eval-artifacts
        read_only: true
        bind:
          create_host_path: false
