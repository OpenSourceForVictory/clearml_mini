server {
    listen 8000;
    server_tokens off;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $interaction_backend interaction-api:8000;
    location = /healthz {
        proxy_pass http://$interaction_backend/healthz?scope=deployment;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location / {
        proxy_pass http://$priority_backend$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
