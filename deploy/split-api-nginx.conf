server {
    listen 8000;
    server_tokens off;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $ordinary_backend api:8000;
    set $control_backend control-api:8000;

    # These paths must stay aligned with backend.app.db_budget.request_category.
    location = /api/v1/worker/heartbeat { proxy_pass http://$control_backend$request_uri; include /etc/nginx/conf.d/proxy-common.inc; }
    location = /api/v1/agent/stop-permit { proxy_pass http://$control_backend$request_uri; include /etc/nginx/conf.d/proxy-common.inc; }
    location ~ ^/api/v1/worker/executions/[^/]+/(service-health|service-probe-session|complete|cleanup|recovery/control|recovery/reconcile)$ {
        proxy_pass http://$control_backend$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location ~ ^/api/v1/jobs/[^/]+/(cancel|retry)$ { proxy_pass http://$control_backend$request_uri; include /etc/nginx/conf.d/proxy-common.inc; }
    location ~ ^/api/v1/batches/[^/]+/(control|retry-failed)$ { proxy_pass http://$control_backend$request_uri; include /etc/nginx/conf.d/proxy-common.inc; }
    location ~ ^/api/v1/admin/services/[^/]+/control$ { proxy_pass http://$control_backend$request_uri; include /etc/nginx/conf.d/proxy-common.inc; }
    location ~ ^/api/v1/orchestrations/[^/]+/services/[^/]+/control$ { proxy_pass http://$control_backend$request_uri; include /etc/nginx/conf.d/proxy-common.inc; }

    location = /healthz {
        auth_request /control-health;
        proxy_pass http://$ordinary_backend/healthz;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /control-health {
        internal;
        proxy_pass http://$control_backend/healthz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location / {
        proxy_pass http://$ordinary_backend$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
