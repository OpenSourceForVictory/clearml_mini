# Opt-in overlay: keep the original public port on a routing gateway.
# Compose >= 2.24 is required for !reset; apply this file after compose.yml.
services:
  api:
    ports: !reset []
    environment:
      DB_BACKPRESSURE_ENABLED: "1"
      API_ROUTE_GROUP: ordinary
      API_DB_PROCESS_COUNT: "2"

  control-api:
    extends:
      file: compose.yml
      service: api
    ports: !reset []
    environment:
      DB_BACKPRESSURE_ENABLED: "1"
      API_ROUTE_GROUP: control
      API_DB_PROCESS_COUNT: "2"
      SCHEDULER_ENABLED: "0"

  api-gateway:
    image: m.daocloud.io/docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./split-api-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-common.inc:/etc/nginx/conf.d/proxy-common.inc:ro
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
      control-api:
        condition: service_healthy
