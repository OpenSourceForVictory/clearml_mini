services:
  db:
    restart: unless-stopped
    image: m.daocloud.io/docker.io/library/postgres:16.8
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: eval
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval"]
      interval: 5s
      retries: 10

  migrate:
    image: mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    image: mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  onboarding:
    restart: unless-stopped
    image: mini-eval-onboarding:dev
    environment:
      ONBOARDING_RECONNECT_TIMEOUT_SECONDS: ${ONBOARDING_RECONNECT_TIMEOUT_SECONDS:-300}
    build:
      context: ..
      dockerfile: onboarding/Dockerfile
    volumes:
      - onboarding_socket:/run/mini-eval-managed-onboarding
      - onboarding_state:/var/lib/mini-eval-onboarding
    healthcheck:
      test: ["CMD", "python", "-m", "onboarding.healthcheck", "/run/mini-eval-managed-onboarding/control.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    restart: unless-stopped
    image: mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-mini-eval-runner:dev}
      ROBOTWIN_RENDER_ENABLED: ${ROBOTWIN_RENDER_ENABLED:-0}
      ONBOARDING_SOCKET: ${ONBOARDING_SOCKET:-/run/mini-eval-managed-onboarding/control.sock}
      MAX_ACTIVE_GLOBAL: ${MAX_ACTIVE_GLOBAL:-2}
      MAX_ACTIVE_PER_USER: ${MAX_ACTIVE_PER_USER:-2}
      MAX_PENDING_PER_USER: ${MAX_PENDING_PER_USER:-20}
      MAX_BATCH_BACKLOG_PER_USER: ${MAX_BATCH_BACKLOG_PER_USER:-10000}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      RECOVERY_EXECUTION_ENABLED: ${RECOVERY_EXECUTION_ENABLED:-1}
      DB_BACKPRESSURE_ENABLED: ${DB_BACKPRESSURE_ENABLED:-0}
      DB_BUDGET_DIAGNOSTICS: ${DB_BUDGET_DIAGNOSTICS:-0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_CONTROL_POOL_SIZE: ${DB_CONTROL_POOL_SIZE:-5}
      DB_OBSERVATION_POOL_SIZE: ${DB_OBSERVATION_POOL_SIZE:-2}
      DB_RESULT_POOL_SIZE: ${DB_RESULT_POOL_SIZE:-2}
      DB_SCHEDULER_POOL_SIZE: ${DB_SCHEDULER_POOL_SIZE:-1}
      API_DB_PROCESS_COUNT: ${API_DB_PROCESS_COUNT:-1}
      DB_CONNECTION_BUDGET: ${DB_CONNECTION_BUDGET:-80}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-0.25}
      DB_LOCK_TIMEOUT_SECONDS: ${DB_LOCK_TIMEOUT_SECONDS:-0.5}
      DB_REQUEST_TIMEOUT_SECONDS: ${DB_REQUEST_TIMEOUT_SECONDS:-4}
      LOST_WORKER_GRACE_SECONDS: ${LOST_WORKER_GRACE_SECONDS:-30}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-3600}
      SHARED_ARTIFACT_HOST_ROOT: ${SHARED_ARTIFACT_HOST_ROOT:-}
      MINI_EVAL_SHARED_STORAGE: ${MINI_EVAL_SHARED_STORAGE:-}
    volumes:
      # An unset root mounts only an inert repository placeholder; API reading stays disabled.
      - type: bind
        source: ${SHARED_ARTIFACT_HOST_ROOT:-./empty-artifacts}
        target: /mnt/mini-eval-artifacts
        read_only: true
        bind:
          create_host_path: false
      - onboarding_socket:/run/mini-eval-managed-onboarding:ro
      - "${ONBOARDING_SOCKET_DIR:-../.runtime/onboarding-socket}:/run/mini-eval-onboarding"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      retries: 10
    depends_on:
      onboarding:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
volumes:
  onboarding_socket:
  onboarding_state:
  pgdata:
