services:
  db:
    image: m.daocloud.io/docker.io/library/postgres:16.8
    environment:
      POSTGRES_DB: eval
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval"]
      interval: 5s
      retries: 10

  migrate:
    image: clearml-mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    image: clearml-mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: clearml-mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CLEARML_API_HOST: ${CLEARML_API_HOST:-}
      CLEARML_WEB_HOST: ${CLEARML_WEB_HOST:-}
      CLEARML_FILES_HOST: ${CLEARML_FILES_HOST:-}
      CLEARML_API_ACCESS_KEY: ${CLEARML_API_ACCESS_KEY:-}
      CLEARML_API_SECRET_KEY: ${CLEARML_API_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      retries: 10
    depends_on:
      bootstrap:
        condition: service_completed_successfully
volumes:
  pgdata:
