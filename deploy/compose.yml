services:
  db:
    restart: unless-stopped
    image: m.daocloud.io/docker.io/library/postgres:16.8
    environment:
      POSTGRES_DB: eval
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval"]
      interval: 5s
      retries: 10

  migrate:
    image: mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    image: mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    restart: unless-stopped
    image: mini-eval-api:dev
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD}@db:5432/eval
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-mini-eval-runner:dev}
      ROBOTWIN_RENDER_ENABLED: ${ROBOTWIN_RENDER_ENABLED:-0}
      MAX_ACTIVE_GLOBAL: ${MAX_ACTIVE_GLOBAL:-2}
      MAX_ACTIVE_PER_USER: ${MAX_ACTIVE_PER_USER:-2}
      MAX_PENDING_PER_USER: ${MAX_PENDING_PER_USER:-20}
      MAX_BATCH_BACKLOG_PER_USER: ${MAX_BATCH_BACKLOG_PER_USER:-10000}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      LOST_WORKER_GRACE_SECONDS: ${LOST_WORKER_GRACE_SECONDS:-30}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-3600}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      retries: 10
    depends_on:
      bootstrap:
        condition: service_completed_successfully
volumes:
  pgdata:
